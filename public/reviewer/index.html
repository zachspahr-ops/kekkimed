<script>window.REVIEW_DATA={"questions":[{"id":"daq_44d46f278f7536af","source_id":"daq_44d46f278f7536af","source":"MedQA","origin_lane":"Medical School boards","target":"procedure_or_intervention","target_confidence":0.9,"correct_label":"C","correct_answer":"Initiate treatment with a vasoconstrictor","sections":[{"section_id":"sec_d28bc60df4693a0ebe17","section":"stem","section_order":1,"text":"A 63-year-old man with a history of hypertension, type 2 diabetes, chronic obstructive pulmonary disease, chronic low back pain, and chronic hepatitis C virus infection with decompensated cirrhosis presents to the emergency department with weakness, low-grade fevers, and fatigue for the past week. He reports no abdominal pain, vomiting, diarrhea, melena, or hematochezia but does note reduced urine output. His current medications are spironolactone 100 mg once daily, furosemide 40 mg once daily, insulin degludec 12 units daily, and acetaminophen occasionally for back pain. He reports no use of opioids or nonsteroidal antiinflammatory drugs. On physical examination, he appears well and is in no acute distress. His temperature is 37.4°C, his heart rate is 94 beats per minute, his blood pressure is 90/53 mm Hg, his respiratory rate is 16 breaths per minute, and his oxygen saturation is 96% while he breathes ambient air. He has moderate ascites, multiple spider angiomas on the chest, and mild asterixis. Laboratory testing yields the following results: Patient value Reference range Leukocyte count (per mm 3 ) 11,300 4500–11,000 Hemoglobin (g/dL) 10.5 13.5–17.5 Platelet count (per mm 3 ) 90,000 150,000–350,000 Sodium (mEq/liter) 129 136–145 Potassium (mEq/liter) 4.9 3.5–5.0 Chloride (mEq/liter) 84 98–106 Bicarbonate (mEq/liter) 20 21–30 Blood urea nitrogen (mg/dL) 34 10–20 Creatinine (mg/dL) 2.8 0.8–1.3 Aspartate aminotransferase (U/liter) 27 0–35 Alanine aminotransferase (U/liter) 33 0–35 Alkaline phosphatase (U/liter) 98 30–120 Total bilirubin (mg/dL) 1.4 0.3–1.0 Direct bilirubin (mg/dL) 0.9 0.1–0.3 Albumin (g/dL) 2.5 3.5–5.5 Prothrombin time (sec) 18.4 11.1–13.1 One week ago, the patient’s blood urea nitrogen level was 12 mg/dL, and his creatinine concentration was 1.2 mg/dL. Urinalysis with sediment is negative for red cells, white cells, protein, leukocyte esterase, nitrites, and casts. The urine sodium level is 5 mEq/liter (reference range varies with intake). The patient is treated with one liter of normal saline. A diagnostic paracentesis is performed, and 50 mL of clear, straw-colored fluid is removed. Analysis of the ascites fluid reveals a neutrophil count of 700 per mm 3 . The patient is started on intravenous ceftriaxone and albumin for spontaneous bacterial peritonitis and is admitted to the hospital, where these medications are continued. His home oral diuretics are held, and he is given additional intravenous albumin on the second hospital day. After 48 hours, his renal function has not improved . In addition to continuing albumin, which one of the following next steps is most appropriate for managing this patient’s acute kidney injury?"},{"section_id":"sec_3f7602492c15af5c781f","section":"explanation","section_order":2,"text":"This patient likely has hepatorenal syndrome ( HRS ). HRS occurs in the setting of cirrhosis and portal hypertension when an increase in vasodilatory factors leads to splanchnic vasodilation and a decrease in systemic vascular resistance . Splanchnic diversion of blood volume results in effective circulating volume depletion, which in turn leads to renal vasoconstriction and hypoperfusion . HRS can be difficult to distinguish from diuretic -induced prerenal azotemia because laboratory results for the two conditions are similar; therefore, volume repletion should be given in the form of intravenous albumin (1 g/kg of body weight, up to 100 g per day) for at least 2 days. If the albumin does not correct the renal dysfunction, HRS is the likely diagnosis. All of the following criteria must be met to make a diagnosis of HRS : • Cirrhosis with ascites • Diagnosis of acute kidney injury (an increase in serum creatinine of ≥0.3 mg/dL from baseline within 48 hours or ≥50% from baseline within 7 days) • No response after 2 consecutive days of diuretic withdrawal and plasma volume expansion with albumin infusions (1g/kg of body weight per day) • Absence of shock • No current or recent use of nephrotoxic drugs ( nonsteroidal antiinflammatory drugs , aminoglycosides , or iodinated contrast media) • No signs of structural kidney injury , as indicated by urine protein excretion \u0026gt;500 mg daily, urine red cell excretion \u0026gt;50 red cells per high-power field , or abnormal renal ultrasound Treatment of HRS includes management of any underlying precipitants as well as therapy directed at the HRS itself. Precipitants of HRS include spontaneous bacterial peritonitis (as in this case), other infections, and gastrointestinal bleeding . Spontaneous bacterial peritonitis is treated with antibiotics and intravenous albumin . Initial medical treatment of HRS depends on the availability of medications. All patients should receive intravenous albumin and a vasoconstrictor. The first-line options for a vasoconstrictor are terlipressin and norepinephrine ; the latter of which must typically be administered in an intensive care setting. An alternative treatment for patients who are not critically ill, and therefore not in an intensive care unit , is the combination of octreotide and midodrine . However, current evidence suggests that this combination is less effective than terlipressin or norepinephrine . Key learning point: Initial medical therapy for hepatorenal syndrome in non-critically ill patients consists of albumin combined with a vasoconstrictor. Terlipressin and norepinephrine are considered first-line options; if neither is available, the combination of midodrine and octreotide can be used."},{"section_id":"sec_012cd59b1d15ea3ae44a","section":"learning_objective","section_o ":0.95},{"mention_id":"m_465df90d8c0fc80c388b9fbb","section_id":"sec_d28bc60df4693a0ebe17","choice_id":null,"raw_span":"albumin","start_char":2578,"end_char":2585,"concept_uid":"LAB:CHEM-001","concept_type":"lab_test","canonical_name":"Albumin, serum","section":"stem","answer_role":"none","assertion":"absent","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_f45d01ad9cd9aa9095e1b810","section_id":"sec_d28bc60df4693a0ebe17","choice_id":null,"raw_span":"acute kidney injury","start_char":2673,"end_char":2692,"concept_uid":"DIS:IM-0352","concept_type":"disease_condition_syndrome","canonical_name":"Other acute kidney injury","section":"stem","answer_role":"none","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95}]},{"id":"daq_3e7314e312344f4a","source_id":"daq_3e7314e312344f4a","source":"MedQA","origin_lane":"Medical School boards","target":"numeric_or_threshold","target_confidence":0.72,"correct_label":"C","correct_answer":"Normal saline (0.9%) at 150 mL per hour, with intravenous furosemide 20 mg if clinical volume overload develops","sections":[{"section_id":"sec_228bba594665c767f37b","section":"stem","section_order":1,"text":"A 76-year-old woman with a history of coronary artery disease, ischemic cardiomyopathy with a left ventricular ejection fraction of 35%, and hypertension presents to the emergency department reporting diminished appetite, nausea, and weakness for the past week. Two weeks ago, she was evaluated by her cardiologist for dyspnea on exertion, and a chest radiograph showed a lung nodule in the left upper lobe. Chest CT confirmed a 4-cm, spiculated lung mass with associated regional lymphadenopathy. Bronchoscopy and biopsy are planned but have not yet been performed. The patient’s husband notes that for the past 2 days, she has “not been acting like herself” and has been sleeping more than usual. Review of systems is also notable for polyuria and constipation. She has had no fevers, shortness of breath, cough, chest pain, or lower-extremity swelling. On physical examination, her blood pressure is 110/65 mm Hg, her heart rate is 102 beats per minute, her respiratory rate is 14 breaths per minute, and her oxygen saturation is 99% while she is breathing ambient air. The examination is notable for dry mucous membranes and mild diffuse abdominal tenderness with no rebound or guarding. There is no jugular venous distention or lower-extremity edema. The patient is able to provide her name and the correct date and name of the hospital but appears somnolent and cannot name the U.S. president. Laboratory testing yields the following results: Patient value Reference range Sodium (mEq/liter) 138 136–145 Potassium (mEq/liter) 4.1 3.5–5.0 Chloride (mEq/liter) 103 98–106 Carbon dioxide (mEq/liter) 23 21–30 Blood urea nitrogen (mg/dL) 35 10–20 Creatinine (mg/dL) 1.6 0.6–1.1 Glucose (mg/dL) 95 70–100 Calcium (mg/dL) 13.8 9.0–10.5 Magnesium (mg/dL) 1.9 1.8–3.0 Albumin (g/dL) 3.2 3.5–5.5 Parathyroid hormone (pg/mL) 9 10–60 Intravenous (IV) access is obtained, and the patient is started on IV fluids and given intramuscular calcitonin 4 IU/kg and intravenous zoledronic acid 4 mg. What is the best strategy for fluid management in this patient?"},{"section_id":"sec_08e29344d3237f2d8bb9","section":"explanation","section_order":2,"text":"This patient with heart failure and a recent diagnosis of a lung mass suspicious for malignancy is presenting with severe hypercalcemia ; her calcium level after correction for hypoalbuminemia is 14.4 mg/dL. Her laboratory tests show a suppressed parathyroid hormone ( PTH ) level, which indicates that her hypercalcemia is from a PTH -independent process. The most likely pathophysiologic mechanism is humoral hypercalcemia of malignancy due to tumor secretion of PTH-related protein ( PTHrP ). Hypercalcemia of malignancy due to PTHrP secretion can be seen with a variety of different cancers, but it is most common in squamous-cell carcinomas and is typically associated with advanced disease and a poor prognosis. There are four goals in managing symptomatic hypercalcemia — correcting volume depletion , enhancing renal calcium excretion, inhibiting bone resorption, and treating the underlying disorder. Hypercalcemia has several complex effects on renal function. In the acute setting, the primary effects are (1) renal vasoconstriction , and (2) inhibition of sodium and water reabsorption in the thick ascending loop of Henle . These effects lead to a reduction in the glomerular filtration rate and contribute to the development of a seemingly paradoxical nephrogenic diabetes insipidus . Losses may be further exacerbated by impaired fluid intake from altered consciousness, nausea , and vomiting . Acute kidney injury from prerenal azotemia is common. These events further limit calcium excretion and can worsen hypercalcemia in a vicious cycle. Volume repletion will help correct hypercalcemia by improving renal function and promoting renal calcium excretion. In this patient, intravenous (IV) fluids must be given cautiously because of the history of heart failure ; thus, normal (0.9%) saline is preferred over more dilute fluids such as half-normal (0.45%) saline given at a faster rate. Volume repletion alone will lower the calcium level to the extent that volume depletion raised it, typically by 1.6 to 2.4 mg/dL. In addition to volume repletion , a bisphosphonate ( zoledronic acid or pamidronate) should be administered for severe hypercalcemia . Administration of this agent is sometimes delayed until after IV fluids have been administered and renal function has improved. Denosumab is another option in this setting. Some guidelines recommend it as a first-line therapy based on indirect evidence suggesting that it might be more effective than a bisphosphonate . However, most clinicians opt for bisphosphonates as first-line therapy because they are less expensive. Denosumab may be a superior option in patients who have persistent hypercalcemia after bisphosphonate administration or in patients with persistent renal dysfunction. When antiresorptive therapy, especially denosumab , is used, close monitoring for hypocalcemia is required, particularly in the setting of renal insufficiency or vitamin D deficiency . Calcitonin is sometimes used to rapidly lower the calcium level while the calcium -lowering effects of the antiresorptive treatment are awaited. When used in this setting, calcitonin should be given subcutaneously or intramuscularly over a period of no more than 48 hours; it cannot be given intravenously, and the nasal formulation does not lower calcium levels. Typically, isotonic saline is given at a rate of 200 mL to 300 mL per hour and then adjusted to maintain urine output of 100 mL to 150 mL per hour. For patients who have heart failure or chronic kidney disease and are at risk for volume overload , as in this case, lower rates of fluid administration may be used, but isotonic saline is still the first-line treatment. Rehydration with isotonic saline is particularly important in patients such as this one who have clinical signs of volume depletion (e.g., tachycardia and elevated blood urea nitrogen ). Loop diuretics , such as furosemide , promote additional renal calcium excretion. However, because volume depletion is common in patients with severe hypercalcemia , loop diuretics should not typically be part of the initial treatment strategy. These medications are only used once the patient has received IV fluids to restore normal volume status and are usually reserved for patients who develop signs of volume overload . Although loop diuretics were historically used along with isotonic saline even in euvolemic patients, this approach has fallen out of favor because the additional benefit of the loop diuretic seems marginal, particularly if the calcium levels can be controlled with bisphosphonates . Therefore, the best option in this patient who is at high risk of developing volume overload is to provide volume repletion with normal saline at a slightly less aggressive rate of 150 mL per hour and to observe closely for volume overload , with administration of an IV loop diuretic if volume overload does develop. Key learning point: Severe hypercalcemia is defined as a serum calcium level \u0026gt;14 mg/dL and should be treated with isotonic saline and either an intravenous bisphosphonate or denosumab , occasionally in conjunction with intramuscular or subcutaneous calcitonin ."},{"section_id":"sec_f47744a5d8902649b961","section":"learning_objective","section_order":3,"text":"Choose appropriate fluid management for a patient with malignant hypercalcemia and high risk for volume overload."},{"section_id":"sec_a57029331ff83f407325","section":"answer","section_order":11,"text":"Normal saline (0.9%) at 200 mL per hour, with intravenous chlorothiazide 500 mg if clinical volume overload develops"},{"section_id":"sec_d04d61c5f434d55f8982","section":"answer","section_order":12,"text":"Half-normal saline (0.45%) at 200 mL per hour, with intravenous furosemide 20 mg if clinical volume overload develops"},{"section_id":"sec_28b158e7aec8a5179dd1","section":"answer","section_order":13,"text":"Normal saline (0.9%) at 150 mL per hour, with intravenous furosemide 20 mg if clinical volume overload develops"},{"section_id":"sec_f1d73f29355c542473a5","section":"answer","section_order":14,"text":"Normal saline (0.9%) at 250 mL per hour, with intravenous furosemide 20 mg now"},{"section_id":"sec_7ef6059d26dda42bdd89","section":"answer","section_order":15,"text":"Normal saline (0.9%) at 83 mL per hour, with intravenous furosemide 20 mg now"}],"choices":[{"choice_id":"choice_055ef65afd7131d89539","choice_label":"A","choice_order":1,"choice_text":"Normal saline (0.9%) at 200 mL per hour, with intravenous chlorothiazide 500 mg if clinical volume overload develops","is_correct":0},{"choice_id":"choice_91ed6f66b5e9822cea95","choice_label":"B","choice_order":2,"choice_text":"Half-normal saline (0.45%) at 200 mL per hour, with intravenous furosemide 20 mg if clinical volume overload develops","is_correct":0},{"choice_id":"choice_0aeb83ff053dfece9d4c","choice_label":"C","choice_order":3,"choice_text":"Normal saline (0.9%) at 150 mL per hour, with intravenous furosemide 20 mg if clinical volume overload develops","is_correct":1},{"choice_id":"choice_96fe6bb8d6f516df525e","choice_label":"D","choice_order":4,"choice_text":"Normal saline (0.9%) at 250 mL per hour, with intravenous furosemide 20 mg now","is_correct":0},{"choice_id":"choice_c0eb61f5a0b57a1b6510","choice_label":"E","choice_order":5,"choice_text":"Normal saline (0.9%) at 83 mL per hour, with intravenous furosemide 20 mg now","is_correct":0}],"mentions":[{"mention_id":"m_48ea408aea30988966b8bacb","section_id":"sec_a57029331ff83f407325","choice_id":"choice_055ef65afd7131d89539","raw_span":"Normal saline","start_char":0,"end_char":13,"concept_uid":"MED:MED-0457","concept_type":"medication","canonical_name":"normal saline","section":"answer","answer_role":"distractor","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_4c37e7eca1f7f5251591e2b2","section_id":"sec_28b158e7aec8a5179dd1","choice_id":"choice_0aeb83ff053dfece9d4c","raw_span":"Normal saline","start_char":0,"end_char":13,"concept_uid":"MED:MED-0457","concept_type":"medication","canonical_name":"normal saline","section":"answer","answer_role":"correct","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_20c302bdb53f7e66121ad99c","section_id":"sec_f1d73f29355c542473a5","choice_i _type":"lab_test","canonical_name":"Parathyroid hormone (PTH), serum","section":"stem","answer_role":"none","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_da9caf15289f0daa87f34988","section_id":"sec_228bba594665c767f37b","choice_id":null,"raw_span":"zoledronic acid","start_char":1965,"end_char":1980,"concept_uid":"MED:MED-0672","concept_type":"medication","canonical_name":"zoledronic acid","section":"stem","answer_role":"none","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95}]},{"id":"daq_64078bfeb0674821","source_id":"daq_64078bfeb0674821","source":"MedQA","origin_lane":"Medical School boards","target":"diagnosis_or_syndrome","target_confidence":0.72,"correct_label":"D","correct_answer":"Low potassium, low phosphorus, hypovolemic","sections":[{"section_id":"sec_73bf6ae463de112a63a0","section":"stem","section_order":1,"text":"An 18-month-old girl is brought to the emergency department because of increased fussiness and vomiting for the past day and heavy, wet diapers for the past week but no diarrhea or fevers. She is tachycardic, but with normal blood pressure for her age and height, and is well perfused. She has deep, labored breathing. Her mucous membranes are dry. Abdominal examination reveals a soft, nondistended abdomen without tenderness. Point-of-care testing identifies a serum glucose level of 680 mg/dL (reference range, 60–100); the venous pH is 7.05 (7.35–7.45). Urinalysis reveals 2+ glucose and ketones. Serum electrolyte levels are as follows: Patient value Reference range Sodium (mEq/liter) 130 135–147 Potassium (mEq/liter) 4.2 3.4–4.7 Chloride (mEq/liter) 96 97–107 Bicarbonate (mEq/liter) 5 16–24 Anion gap (mEq/liter) 29 8–12 Phosphorus (mg/dL) 4.7 4.5–6.5 Magnesium (mEq/liter) 1.8 1.26–2.1 Glucose (mg/dL) 720 60–100 Which of the following total-body stores of electrolytes and volume status is this patient most likely to have?"},{"section_id":"sec_5ba4f5178e3a9d5e5b8c","section":"explanation","section_order":2,"text":"This patient is presenting with new-onset type 1 diabetes complicated by severe diabetic ketoacidosis ( DKA ). She meets diagnostic criteria for DKA by exhibiting hyperglycemia ( glucose level \u0026gt;200 mg/dL), acidemia (venous pH \u0026lt;7.3), and large ketonuria . Appropriate treatment of DKA consists of resuscitation fluids followed by deficit-replacement fluids, insulin therapy , and electrolyte repletion ; in addition, patients should be monitored closely for complications of DKA and its therapy, including cerebral edema , electrolyte abnormalities ( hypokalemia , hypomagnesemia , hypophosphatemia ), hyperchloremic acidemia , and hypoglycemia . Children with DKA have glucosuria , which leads to an osmotic diuresis with loss of sodium and water, resulting in volume depletion . There are also urinary losses of a range of electrolytes , but the initial serum electrolyte values may not represent total-body stores of these electrolytes . In DKA , serum sodium is affected by water movement in two ways: (1) the osmotic dilution effect of hyperglycemia ( hyperosmolality due to hyperglycemia draws free water out of the cells, diluting the serum and reducing the measured serum sodium level), and (2) osmotic diuresis that leads to excess water loss and therefore relative deficiency in water, with a resulting increase in the measured sodium concentration. Younger children may not be able to independently replete their excessive water losses as efficiently as older children and adults can. To account for the dilutional effect of hyperglycemia , a corrected sodium level can be calculated. This corrected level is an estimate of what the measured serum sodium level would have been if there was no hyperglycemia and can therefore indicate whether there is free-water deficiency (if the corrected sodium level is in the hypernatremia range) or free-water excess (if the corrected sodium level is in the hyponatremia range). This can then influence the choice of intravenous fluid to correct the patient’s water and volume derangements. The corrected sodium level is calculated by adding 1.6 mEq/liter to the measured sodium level for every 100-mg/dL increase in the glucose level above a level of 100 mg/dL. In this patient, who has a measured serum sodium level of 130 mEq/liter and glucose level of 720 mg/dL, the corrected sodium level is 130 + (1.6 x 6.2), or approximately 140 mEq/liter. Patients with DKA also have a total-body potassium deficit (typically on the order of 3 to 6 mmol/kg, related to transcellular shifts, osmotic diuresis , urinary excretion from secondary hyperaldosteronism , and losses from vomiting ), although their initial serum potassium level may be low, normal, or high. This deficit requires potassium repletion through intravenous fluids ; typically, 40 mEq/liter is added to the fluids as a combination of potassium chloride , acetate, or phosphate , and then the content is adjusted on the basis of subsequent serum potassium measurements. If the patient is initially hyperkalemic , potassium is added after demonstration of urine output; if the patient is initially hypokalemic , the potassium infusion may be required before initiation of insulin therapy to prevent worsening of hypokalemia due to insulin -mediated shift of potassium into cells. Osmotic diuresis also results in a total-body deficit of phosphorus (typically on the order of 0.5–2.5 mmol/kg), although the serum phosphorus level is often elevated at presentation because of insulin deficiency and metabolic acidemia . Insulin treatment and correction of acidemia causes serum phosphorus levels to drop, unmasking the total-body phosphorus deficit. Key learning point: Patients with diabetic ketoacidosis have deficits in total-body potassium and phosphorus ."},{"section_id":"sec_bc1652c4beab42cad906","section":"learning_objective","section_order":3,"text":"Recognize diabetic ketoacidosis in a young child, and anticipate total-body store depletion of potassium and phosphorus despite normal laboratory values."},{"section_id":"sec_4ee05ffea0128f388261","section":"answer","section_order":11,"text":"Normal potassium, normal phosphorus, hypovolemic"},{"section_id":"sec_5841a1bc436dd87735bc","section":"answer","section_order":12,"text":"Low potassium, high phosphorus, euvolemic"},{"section_id":"sec_a3fb5e691e62d93f9ff3","section":"answer","section_order":13,"text":"Low potassium, normal phosphorus, euvolemic"},{"section_id":"sec_e6661e191d25ce047954","section":"answer","section_order":14,"text":"Low potassium, low phosphorus, hypovolemic"},{"section_id":"sec_306be0e26823e6f5597b","section":"answer","section_order":15,"text":"Low potassium, normal phosphorus, hypovolemic"}],"choices":[{"choice_id":"choice_9aa5c02222a5e86ea219","choice_label":"A","choice_order":1,"choice_text":"Normal potassium, normal phosphorus, hypovolemic","is_correct":0},{"choice_id":"choice_c73f984a09c3b10d28d0","choice_label":"B","choice_order":2,"choice_text":"Low potassium, high phosphorus, euvolemic","is_correct":0},{"choice_id":"choice_aa1d08c06dc95c9fe530","choice_label":"C","choice_order":3,"choice_text":"Low potassium, normal phosphorus, euvolemic","is_correct":0},{"choice_id":"choice_a57605e69170fb944165","choice_label":"D","choice_order":4,"choice_text":"Low potassium, low phosphorus, hypovolemic","is_correct":1},{"choice_id":"choice_4518b0e68f07f1cbb334","choice_label":"E","choice_order":5,"choice_text":"Low potassium, normal phosphorus, hypovolemic","is_correct":0}],"mentions":[{"mention_id":"m_924ce51b1a7baf297c3eae4d","section_id":"sec_5841a1bc436dd87735bc","choice_id":"choice_c73f984a09c3b10d28d0","raw_span":"Low potassium","start_char":0,"end_char":13,"concept_uid":"DIS:IM-0391","concept_type":"disease_condition_syndrome","canon d_char":870,"concept_uid":"LAB:MIN-004","concept_type":"lab_test","canonical_name":"Magnesium, serum","section":"stem","answer_role":"none","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_459670dac0849ed3920bdacc","section_id":"sec_73bf6ae463de112a63a0","choice_id":null,"raw_span":"Glucose","start_char":896,"end_char":903,"concept_uid":"LAB:DIAB-001","concept_type":"lab_test","canonical_name":"Glucose, plasma, fasting","section":"stem","answer_role":"none","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95}]},{"id":"daq_689dd35cf88a669c","source_id":"daq_689dd35cf88a669c","source":"MedQA","origin_lane":"Medical School boards","target":"numeric_or_threshold","target_confidence":0.9,"correct_label":"E","correct_answer":"Administer 1 liter of 0.9% sodium chloride intravenously","sections":[{"section_id":"sec_e0ba4e2c4af3c8f461da","section":"stem","section_order":1,"text":"A 65-year-old woman with a history of hypertension, hypothyroidism, systemic lupus erythematosus, adrenal insufficiency, osteopenia, and depression presents to the emergency department (ED) with acute onset of nausea and vomiting for 12 hours. She reports lightheadedness, especially when standing. Her medications include amlodipine 5 mg daily, chlorthalidone 12.5 mg daily, levothyroxine 125 μg daily, hydrocortisone 15 mg in the morning and 5 mg in the evening, fludrocortisone 0.05 mg 5 days per week, calcium carbonate 500 mg twice daily, and citalopram 10 mg daily. When the patient is supine, her blood pressure is 110/60 mm Hg, and her heart rate is 90 beats per minute. When she sits up, her blood pressure decreases to 100/60 mm Hg, and her heart rate increases to 125 beats per minute. Her mucous membranes appear dry, and her lungs are clear bilaterally. Heart sounds are normal, there is no jugular venous distention, and her extremities show no edema. A chest radiograph performed in the ED shows a 1.2-cm nodule in the right upper lung field that was not present on images obtained 18 months ago. Laboratory findings are as follows: Patient value Reference range Hemoglobin (g/dL) 15.6 12.0–16.0 Hematocrit (%) 45.9 36.0–46.0 Leukocyte count (per mm 3 ) 6500 4500–11,000 Platelet count (per mm 3 ) 355,000 150,000–350,000 Sodium (mEq/liter) 125 136–145 Potassium (mEq/liter) 4.3 3.5–5.0 Chloride (mEq/liter) 85 98–106 Carbon dioxide (mEq/liter) 32 21–30 Blood urea nitrogen (mg/dL) 42 10–20 Creatinine (mg/dL) 1.4 0.6–1.1 Total calcium (mg/dL) 12.5 9.0–10.5 Albumin (g/dL) 3.9 3.5–5.5 Glucose (mg/dL) 125 70–100 Serum osmolality (mOsm/kg) 273 285–295 Urine Specific gravity 1.031 1.001–1.035 pH 5.0 5.0–9.0 Sodium (mEq/liter) \u0026lt;20 Varies with intake Potassium (mEq/liter) 60 Varies with intake Creatinine (mg/dL) 100 Varies with intake Osmolality (mOsm/kg) 830 Varies with intake In addition to holding the chlorthalidone and calcium supplement, providing stress doses of glucocorticoids, and serially reassessing the patient’s clinical condition and laboratory parameters, which one of the following next steps is most appropriate for immediate management?"},{"section_id":"sec_3eea0705e207f45fb802","section":"explanation","section_order":2,"text":"There are several potential etiologies for this patient’s nausea , vomiting , and lightheadedness . She may have adrenal insufficiency , or her symptoms may be related to her hypercalcemia and hyponatremia . In any patient who presents with a history of adrenal insufficiency and new intercurrent illness, it is reasonable to increase the dose of the glucocorticoid ( stress dose). However, the dose of the mineralocorticoid ( fludrocortisone ) generally does not need to be increased; in fact, if a high dose of intravenous hydrocortisone is used for the stress dose of the glucocorticoid , then it provides sufficient mineralocorticoid activity itself, and the mineralocorticoid can be stopped for a few days. In addition to stress doses of glucocorticoids , intravenous fluids are also indicated in a patient with acutely symptomatic adrenal insufficiency . This patient’s hypercalcemia is of unclear etiology at this point but may be related to the possible malignancy seen on chest radiography . The best initial management of hypercalcemia is intravenous fluids such as 0.9% sodium chloride . Before starting intravenous fluids for the hypercalcemia and the adrenal insufficiency , the effects of this intervention on the patient’s hyponatremia should be considered. This patient’s history and physical examination findings suggest hypovolemia . Hypovolemia stimulates antidiuretic hormone ( ADH ) secretion, which will increase renal reabsorption of water and reduce urine volume. In addition, hypovolemia stimulates the sympathetic nervous system and the renin-angiotensin-aldosterone axis, leading to an increase in renal sodium reabsorption. In the setting of volume depletion , the urine osmolality should be very high and the urinary sodium very low, as is seen here. In this setting, if the patient ingests dilute fluids, hyponatremia will develop. When volume is restored in patients with hypovolemic hyponatremia , the stimulus for ADH is no longer present, and the kidneys are able to excrete the excess water. Thus, the most appropriate next step in this case is administration of 1 liter of 0.9% sodium chloride . It is worth noting, however, that patients with hypovolemic hyponatremia are at risk for rapid correction and require close monitoring. ADH levels should rise in hypovolemia and hyperosmolality . When ADH levels are elevated without these two conditions, it is diagnostic of the syndrome of inappropriate antidiuretic hormone ( SIADH ). In SIADH , patients are euvolemic , but the inappropriate release of ADH leads to concentrated urine. If the patient ingests dilute fluids, hyponatremia develops. This patient has several risk factors for SIADH , including a lung lesion and use of a selective serotonin -reuptake inhibitor, but the clinical history of vomiting , physical examination finding of orthostatic tachycardia , and low urine sodium level suggest hypovolemia . Treatment for SIADH typically includes addressing the underlying cause and restricting fluid intake, with additional interventions to be considered if necessary. Thiazide diuretics , including chlorthalidone , lead to hyponatremia more commonly than loop diuretics . Thiazide diuretics act in the distal convoluted tubule and interfere with the kidneys ’ ability to maximally dilute the urine. As a result, the kidneys have more difficulty excreting a water load, which can lead to hyponatremia , particularly in individuals with other reasons for impaired water excretion, such as older individuals and those with lower solute intake. If this was the primary cause of this patient’s hyponatremia , then the urine sodium would not be low, and the urine osmolality would not be as high as it is. Key learning point: In a patient with hypotonic hyponatremia associated with volume depletion , treatment should first be aimed at providing adequate fluid volume and establishing euvolemia ."},{"section_id":"sec_1e772bc1e2c283d2a3b3","section":"learning_objective","section_order":3,"text":"Choose the most appropriate strategy to manage hyponatremia in a complex medical patient presenting with volume depletion."},{"section_id":"sec_b17cfe906c32fefc5da9","section":"answer","section_order":11,"text":"Administer 4 mg of zoledronic acid intravenously"},{"section_id":"sec_3c98704a282c7c368f25","section":"answer","section_order":12,"text":"Administer 100 mL of 3% sodium chloride intravenously"},{"section_id":"sec_4562cd5dfbeeea9a5b61","section":"answer","section_order":13,"text":"Start furosemide 40 mg twice daily"},{"section_id":"sec_4938cb8c122a3b52ea7e","section":"answer","section_order":14,"text":"Increase fludrocortisone to 0.1 mg daily"},{"section_id":"sec_61d1830680467d90f6c3","section":"answer","section_order":15,"text":"Administer 1 liter of 0.9% sodium chloride intravenously"}],"choices":[{"choice_id":"choice_76dd9c4f3c0ed1fac263","choice_label":"A","choice_order":1,"choice_text":"Administer 4 mg of zoledronic acid intravenously","is_correct":0},{"choice_id":"choice_773be7307353967b145b","choice_label":"B","choice_order":2,"choice_text":"Administer 100 mL of 3% sodium chloride intravenously","is_correct":0},{"choice_id":"choice_c55c9604ce135e76b55d","choice_label":"C","choice_order":3,"choice_text":"Start furosemide 40 mg twice daily","is_correct":0},{"choice_id":"choice_87611be356ade5fde396","choice_label":"D","choice_order":4,"choice_text":"Increase fludrocortisone to 0.1 mg daily","is_correct":0},{"choice_id":"choice_df6b23020bbe91ce6c41","choice_label":"E","choice_order":5,"choice_text":"Administer 1 liter of 0.9% sodium chloride intravenously","is_correct":1}],"mentions":[{"mention_id":"m_d17299ac5e10c0bc20475a53","section_id":"sec_4938cb8c122a3b52ea7e","choice_id":"choice_87611be356ade5fde396","raw_span":"fludrocortisone","start_char":9,"end_char":24,"concept_uid":"MED:MED-0213","concept_type":"medication","canonical_name":"fludrocortisone","section":"answer","answer_role":"distractor","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_8b19744c5653cc0ee37dbb74","section_id":"sec_b17cfe906c32fefc5da9","choice_id":"choice_76dd9c4f3c0ed1fac263","raw_span":"zoledronic acid","start_char":19,"end_char":34,"concept_uid":"MED:MED-0672","concept_type":"medication","canonical_name":"zoledronic acid","section":"answer","answer_role":"distractor","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","conf nt","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95}]},{"id":"daq_bcc8a8f32eb863b7","source_id":"daq_bcc8a8f32eb863b7","source":"MedQA","origin_lane":"Medical School boards","target":"medication_or_pharmacologic","target_confidence":0.88,"correct_label":"E","correct_answer":"Aztreonam, levofloxacin, and vancomycin","sections":[{"section_id":"sec_50df1d0a837d2e078e98","section":"stem","section_order":1,"text":"A 63-year-old woman is brought to the emergency department with altered mental status after her husband found her difficult to awaken. She is lethargic and cannot provide a history but reports diffuse abdominal pain. Her husband says that she was discharged from the hospital 3 weeks ago after an episode of hepatic encephalopathy and that she has a history of decompensated cirrhosis secondary to nonalcoholic steatohepatitis, ascites, type 2 diabetes requiring insulin therapy, bronchiectasis, and hyperlipidemia. He mentions that she seemed to choke last night while drinking a nutritional-supplement beverage and also reports that she has a history of anaphylaxis with exposure to ampicillin. On physical examination, the patient has a regular rhythm with a heart rate of 105 beats per minute, a blood pressure of 85/45 mm Hg, a temperature of 38.5°C , a respiratory rate of 25 breaths per minute, and an oxygen saturation of 92% with 2 liters of supplemental oxygen, which she does not usually need. She has difficulty maintaining alertness and has evidence of asterixis, but a limited neurologic examination is otherwise normal. Lung auscultation reveals rhonchi over the right posterior and anterior lung fields. The patient has mild diffuse abdominal pain with an abdominal fluid wave. There is slight erythema on the sacrum but no ulcers or skin tenderness. Laboratory testing reveals an elevated leukocyte count with leftward shift; chronic anemia and thrombocytopenia without change from baseline; stable elevations in total bilirubin, prothrombin time, and international normalized ratio; and an elevated lactic acid level. Urinalysis shows 1+ leukocyte esterase, 1+ bacteria, and 2+ squamous epithelial cells. A chest radiograph reveals an opacity in the right lower lung field that shades the right heart border and evidence of bronchiectasis. Blood cultures are drawn quickly, and sputum and urine cultures are ordered. The patient is started on intravenous crystalloids in the resuscitation of her sepsis. Plans are made to perform a diagnostic paracentesis and administer albumin. What is the most appropriate initial antibiotic regimen for this patient?"},{"section_id":"sec_3c3f92e90d3655393611","section":"explanation","section_order":2,"text":"Prompt initiation of appropriate antibiotic coverage is vital for treating sepsis . Guidelines from the Surviving Sepsis Campaign (SSC) recommend that sepsis be treated with an initial empiric antibiotic regimen that covers all likely pathogens. Antibiotic therapy should be started within one hour of sepsis diagnosis to reduce mortality risk. This short time interval makes it important to start empiric therapy before a full diagnostic evaluation has been completed. Inappropriate selection of empiric antibiotic therapy can result in significant morbidity . Choosing empiric antibiotics for the treatment of sepsis is often complicated by multiple potential sources of infection, patient comorbidities, risks of exposure to multidrug-resistant ( MDR ) pathogens, and allergic reactions to prior antibiotic therapy . Clinicians should also consult local antibiograms when selecting empiric therapy to determine whether there is a high local prevalence of resistance to antibiotics . This patient has two potential anatomical sources of infection that should be covered with the initial antibiotic regimen: pneumonia and spontaneous bacterial peritonitis . Her urinalysis results make a urinary source of infection less likely. Given her recent hospital stay and history of bronchiectasis , she is at increased risk for exposure to MDR pathogens and therefore requires coverage of methicillin-resistant Staphylococcus aureus ( MRSA ) and resistant gram-negative organisms such as Pseudomonas . The SSC guidelines recommend using combination therapy with two antibiotics from different classes to treat suspected gram-negative pathogens. This patient also had a recent episode of aspiration , making coverage of oral flora a priority. In many cases, aspiration results in a chemical pneumonitis without infection; however, in a patient who is critically ill, it is reasonable to empirically cover for possible aspiration pneumonia . Key learning point: In a patient presenting with suspected sepsis and concern for both aspiration pneumonia and spontaneous bacterial peritonitis who has a history of cirrhosis , bronchiectasis , and recent hospital admission, the most appropriate initial antibiotic therapy includes coverage for resistant gram-negative rods and methicillin-resistant Staphylococcus aureus ."},{"section_id":"sec_f67652fb79d75e64b08f","section":"learning_objective","section_order":3,"text":"Choose the best antibiotic regimen for a patient with multiple comorbidities who presents with sepsis from multiple potential sources."},{"section_id":"sec_becd61f7419cb780fd3d","section":"answer","section_order":11,"text":"Levofloxacin, piperacillin-tazobactam, and vancomycin"},{"section_id":"sec_1370fac0b5d8a9c28bf5","section":"answer","section_order":12,"text":"Aztreonam, metronidazole, and vancomycin"},{"section_id":"sec_460757df726b267700c0","section":"answer","section_order":13,"text":"Ertapenem, levofloxacin, and vancomycin"},{"section_id":"sec_5e66154ab2d288a661ee","section":"answer","section_order":14,"text":"Aztreonam and vancomycin"},{"section_id":"sec_4c1b5a09836d275b8918","section":"answer","section_order":15,"text":"Aztreonam, levofloxacin, and vancomycin"}],"choices":[{"choice_id":"choice_48513d634fedbfb74f27","choice_label":"A","choice_order":1,"c on, he appears mildly uncomfortable, without acute respiratory distress. He has a temperature of 37°C , a heart rate of 88 beats per minute, a blood pressure of 106/58 mm Hg, and a respiratory rate of 20 breaths per minute while lying flat, with an oxygen saturation of 91% while breathing ambient air. He has numerous spider nevi on his chest. Cardiac examination is notable for a regular rate and rhythm with no gallop or murmurs. Pulmonary examination reveals normal percussion and lung sounds bilaterally with no wheezing, rhonchi, or crackles. His oxygen saturation drops to 85% when he moves from a supine to an upright position . Abdominal examination reveals mild ascites and splenomegaly. He has trace lower-extremity edema and no focal deficits or asterixis. Laboratory findings are as follows: Patient value Reference range Sodium ( mEq/L ) 128 136–145 Potassium ( mEq/L ) 4.2 3.5–5.0 Chloride ( mEq/L ) 101 98–106 Bicarbonate ( mEq/L ) 27 21–30 Blood urea nitrogen ( mg/dL ) 7 10–20 Creatinine ( mg/dL ) 0.9 0.8–1.3 Aspartate aminotransferase (U/liter) 21 0–35 Alanine aminotransferase (U/liter) 31 0–35 Alkaline phosphatase (U/liter) 104 30–120 Total bilirubin ( mg/dL ) 2.2 0.3–1.0 Direct bilirubin ( mg/dL ) 1.1 0.1–0.3 Albumin ( g/dL ) 2.2 3.5–5.5 Leukocyte count (per mm 3 ) 9000 4500–11,000 Hemoglobin ( g/dL ) 9.6 13.5–17.5 Platelet count (per mm 3 ) 45,000 150,000–350,000 International normalized ratio 2.4 — Brain natriuretic peptide ( pg/mL ) 87 \u0026lt;64 His Model for End-Stage Liver Disease (MELD) score is currently 25, up from 17 at his last visit 3 months ago. A chest radiograph is obtained (figure). Diagnostic paracentesis of 25 mL of clear yellow fluid is negative for spontaneous bacterial peritonitis. A transthoracic echocardiogram is scheduled. The patient is admitted to the hospital for further workup and management. Which one of the following conditions is the most likely cause of this patient’s dyspnea?"},{"section_id":"sec_e20a8a33e7d498838402","section":"explanation","section_order":2,"text":"Hepatopulmonary syndrome ( HPS ) is a pulmonary vascular disorder that is associated with cirrhosis and most commonly occurs with portal hypertension . HPS is characterized by three main components: liver disease, a defect in oxygenation, and pulmonary vascular dilation. Various pathogenic mechanisms lead to pulmonary capillary dilation and subsequent arteriovenous connections. These, in turn, result in ventilation-perfusion mismatch and oxygen diffusion limitation , which lead to dyspnea . The most common clinical symptom in HPS is progressive dyspnea that can occur on exertion, at rest, or both. Two other associated (but not pathognomonic ) signs of HPS include platypnea (worsening dyspnea induced by moving into an upright position) and orthodeoxia (a reduction in arterial oxygen tension by \u0026gt; 4 mm Hg — or in arterial oxyhemoglobin desaturation by \u0026gt; 5% — when the patient moves from a supine to an upright position, with subsequent improvement when the patient returns to a recumbent position ). These findings occur because the arteriovenous connections tend to occur predominantly in the lung bases, with resulting increased shunting with upright posture. Diagnostic evaluation for HPS involves arterial blood gas testing and contrast-assisted transthoracic echocardiography . Chest radiography , chest CT, and pulmonary function testing are usually of little diagnostic benefit, other than ruling out other causes for dyspnea ; this patient’s chest radiograph was normal except for low lung volumes . Treatment includes oxygen supplementation and referral for liver transplantation . Key learning point: In a patient with cirrhosis and portal hypertension , progressive dyspnea and hypoxemia that is worse when the patient moves upright and improved when the patient is supine is most likely due to hepatopulmonary syndrome ."},{"section_id":"sec_4702bfcf88c107fb6211","section":"learning_objective","section_order":3,"text":"Recognize hepatopulmonary syndrome."},{"section_id":"sec_29433163e8f2f879b09c","section":"answer","section_order":11,"text":"Hepatic hydrothorax"},{"section_id":"sec_28d59f7873fb7d80510f","section":"answer","section_order":12,"text":"Chronic obstructive pulmonary disease exacerbation"},{"section_id":"sec_303aa367dec339ba3459","section":"answer","section_order":13,"text":"Portopulmonary hypertension"},{"section_id":"sec_4c6effd32878a8be0aa2","section":"answer","section_order":14,"text":"Heart failure"},{"section_id":"sec_c3a76c03465b076c6514","section":"answer","section_order":15,"text":"Hepatopulmonary syndrome"}],"choices":[{"choice_id":"choice_e9c07032006b739a53e6","choice_label":"A","choice_order":1,"choice_text":"Hepatic hydrothorax","is_correct":0},{"choice_id":"choice_ea24822696ef7d0dc82e","choice_label":"B","choice_order":2,"choice_text":"Chronic obstructive pulmonary disease exacerbation","is_correct":0},{"choice_id":"choice_3745382553013b29f226","choice_label":"C","choice_order":3,"choice_text":"Portopulmonary hypertension","is_correct":0},{"choice_id":"choice_df3028e352ce6385f58d","choice_label":"D","choice_order":4,"choice_text":"Heart failure","is_correct":0},{"choice_id":"choice_ff181f03e890353528fa","choice_label":"E","choice_order":5,"choice_text":"Hepatopulmonary syndrome","is_correct":1}],"mentions":[{"mention_id":"m_9c13343aaa82c56ea3580305","section_id":"sec_c3a76c03465b076c6514","choice_id":"choice_ff181f03e890353528fa","raw_span":"Hepatopulmonary syndrome","start_char":0,"end_char":24,"concept_uid":"DIS:IM-0635","concept_type":"disease_condition_syndrome","canonical_name":"Hepatopulmonary syndrome","section":"answer","answer_role":"correct","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_cd023add7cfc9d6ba9adc0d4","section_id":"sec_28d59f7873fb7d80510f","choice_id":"choice_ea24822696ef7d0dc82e","raw_span":"Ch 2662,"concept_uid":"IMG:IMG0126","concept_type":"imaging_test","canonical_name":"Transthoracic echocardiogram","section":"stem","answer_role":"none","assertion":"absent","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_9f737f9ac6cf500efdea9e2f","section_id":"sec_52241987ebc51342cc54","choice_id":null,"raw_span":"hospital","start_char":2708,"end_char":2716,"concept_uid":"FCTR:FCTR-0034","concept_type":"etiology_factor","canonical_name":"Healthcare exposure","section":"stem","answer_role":"none","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95}]},{"id":"daq_43ea91d004328587","source_id":"daq_43ea91d004328587","source":"MedQA","origin_lane":"Medical School boards","target":"medication_or_pharmacologic","target_confidence":0.88,"correct_label":"A","correct_answer":"Alendronate therapy appears to be effective for her and should be continued for now","sections":[{"section_id":"sec_ddf6763f26d38dabe5df","section":"stem","section_order":1,"text":"A 60-year-old woman with a history of celiac disease, vitamin D deficiency, hypothyroidism, fibromyalgia, and new atrial fibrillation presents for follow-up of osteoporosis that was diagnosed on routine screening dual-energy x-ray absorptiometry (DXA) 4 years ago. She has been taking alendronate 70 mg once weekly for 3 years with no adverse effects and has no history of fractures. Her other medications are calcium carbonate 600 mg daily, ergocalciferol 2000 IU daily, levothyroxine 88 μg daily, duloxetine 30 mg daily, atenolol 25 mg daily, and rivaroxaban 20 mg daily. Menopause occurred at age 52, and she did not receive hormone replacement therapy. She has never received glucocorticoid treatment. Calcium intake includes one glass of skim milk and one yogurt each day. Weight-bearing exercise is minimal because of joint and muscle pain from fibromyalgia. She has never smoked cigarettes and drinks five glasses of wine per week. Her family history is significant for osteoporosis and hip fracture in her mother. She sees a dentist every 6 months and has a routine cleaning scheduled in 2 weeks. She was recently evaluated in a local emergency department for palpitations and diagnosed with atrial fibrillation. She has been thin her whole life but lost an additional 5 kg about 10 years ago, before her diagnosis of celiac disease, that she never gained back. She is currently 163 cm tall and 51 kg (BMI 19.2). Physical examination is notable for mild kyphosis and a slowed gait. Recent laboratory testing showed normal kidney function with an estimated glomerular filtration rate of 95 mL/min/1.73 m 2 (reference range, ≥60), a serum calcium level of 9.6 mg/dL ( 9.0–10.5 ), and a 25-hydroxyvitamin D level of 32 ng/mL ( 30–80 ). Current DXA results are as follows: 4 years ago Today Lumbar spine T score –2.7 –2.5 Femoral neck T score –2.9 –2.6 You recommend continued treatment with alendronate, but the patient is hesitant. A friend of hers who is a dentist warned her about the possible adverse effects of long-term bisphosphonate therapy. What is the best advice to give this patient regarding continuation of alendronate therapy?"},{"section_id":"sec_6e468b2eae1a88a8011d","section":"explanation","section_order":2,"text":"This patient has multiple risk factors for osteoporosis including her postmenopausal status, low BMI , vitamin D deficiency , celiac disease , and family history of osteoporosis and hip fracture . After 3 years of oral bisphosphonate use, her lumbar spine and femoral neck T scores have improved but remain in the osteoporotic range (≤–2.5). She is concerned about continuing therapy because of the risk of adverse effects, but it is important to put these risks into context for her. The most common adverse effects of bisphosphonate therapy include gastroesophageal reflux , esophagitis , and ulcers (seen with oral therapy), hypocalcemia and muscle aches (seen with both oral and intravenous [IV] therapy), and an acute-phase reaction characterized by flulike symptoms (seen with IV therapy only). Renal impairment can also occur, leading to recommendations that bisphosphonates be used with caution in patients who have renal insufficiency and not at all in those with an estimated glomerular filtration rate below 30 to 35 mL/min/1.73 m 2 . However, patients frequently report concern for far less common adverse effects of bisphosphonates , primarily osteonecrosis of the jaw ( ONJ ) and atypical femur fractures (AFF), as these conditions received widespread media attention when they were first described. ONJ is defined as an area of exposed bone in the maxillofacial region that does not heal within 8 weeks in a patient exposed to an antiresorptive agent with no history of radiation therapy to the craniofacial region. The incidence of ONJ is highest in patients being treated for cancer (1%–15%), as they typically receive high-dose IV bisphosphonates ; however, the incidence in those receiving bisphosphonates for osteoporosis (0.001%–0.01%) is only slightly higher than that in the general population. Other risk factors for ONJ include maxillary or mandibular bone surgery , poor oral hygiene, ill-fitting dentures, glucocorticoid therapy, and diabetes mellitus . Risk for ONJ can be reduced by completing any necessary dental procedures before initiating antiresorptive therapy and by maintaining good oral hygiene. AFFs are defined as atraumatic or low‐trauma fractures in the subtrochanteric region or femoral shaft and have been reported in patients taking bisphosphonates and denosumab . Although the relative risk of AFF is increased in patients taking bisphosphonates , the absolute risk is low and ranges from 3.2 to 50 cases per 100,000 person-years . This risk increases with longer durations of therapy but is still relatively low (\u0026lt;100 cases per 100,000 person-years ). Putting these numbers in context may be helpful for the patient. In a patient being treated with a bisphosphonate , the annual risk of developing AFF or ONJ is below 1 in 10,000. This risk is in the same order of magnitude as the risk of Stevens-Johnson syndrome with commonly prescribed medications such as allopurinol or antiepileptic drugs and is also similar to the lifetime risk of being struck by lightning. The risk of AFF or ONJ is also much lower than the risk of osteoporotic fractures . According to the Fracture Risk Assessment Tool ( FRAX ), this patient’s 10-year probability of fracture is around 20% for any major osteoporotic fracture and 2.5% for hip fracture . Alendronate is expected to reduce this risk by 30% to 50%. Thus, for every 10,000 women similar to this one who is being treated with alendronate, there may be one case each of ONJ and AFF but as many as 1000 major osteoporotic fractures prevented. Therefore, the risk-benefit ratio is in favor of using bisphosphonates . Of note, the FRAX calculator is useful for assessing fracture risk, but clinicians should not use it in determining whether to initiate treatment in a patient who has osteoporosis confirmed by bone mineral density or by the presence of a fragility fracture ; the FRAX calculator is only used for this purpose in patients with osteopenia . The American Society for Bone and Mineral Research recommends reassessing risk after 5 years of oral bisphosphonate therapy or 3 years of IV bisphosphonate therapy. For women at high risk for fracture , including those who have had a fracture while receiving therapy or who have T scores in the osteoporotic range, oral bisphosphonate therapy can be continued for up to 10 years and IV therapy for up to 6 years. Although the incidence of AFF and ONJ increases with longer duration of bisphosphonate therapy, these risks are outweighed by the benefits of vertebral fracture reductions in high-risk patients. This patient is tolerating bisphosphonate therapy well and remains at high risk of fracture with T scores in the osteoporotic range. She should continue therapy for at least 5 years total, at which point risk reassessment can be performed. Key learning point: For patients with postmenopausal osteoporosis who are taking bisphosphonate therapy, the risk of medication-related complications, such as osteonecrosis of the jaw and atypical femur fractures , is low and typically less worrisome than the risk of fractures without therapy."},{"section_id":"sec_5f994891fd4a48ad59a1","section":"learning_objective","section_order":3,"text":"Choose the most appropriate advice for a patient who is concerned about the rare adverse effects associated with long-term bisphosphonate therapy."},{"section_id":"sec_8f799f467be554b3aa79","section":"answer","section_order":11,"text":"Alendronate therapy appears to be effective for her and should be continued for now"},{"section_id":"sec_a93865f1bad9833024fe","section":"answer","section_order":12,"text":"Alendronate therapy is safe, but she has completed 3 years of treatment and can discontinue the medication"},{"section_id":"sec_3e603b3f5844a8e41661","section":"answer","section_order":13,"text":"Her atrial fibrillation was likely caused by alendronate, and the medication should therefore be discontinued"},{"section_id":"sec_c9eaa214f6614d2068dc","section":"answer","section_order":14,"text":"The risk of atypical femur fractures caused by alendronate might outweigh the benefits on reduced risk of fracture elsewhere, and she should therefore be switched to denosumab"},{"section_id":"sec_0bae6c80236c6b0a9f8a","section":"answer","section_order":15,"text":"Continuing alendronate therapy would be associated with a high risk of osteonecrosis of the jaw, and the medication should therefore be discontinued"}],"choices":[{"choice_id":"choice_327508f0cbdef5b4e301","choice_label":"A","choice_order":1,"choice_text":"Alendronate therapy appears to be effective for her  had fevers up to 39.2°C and headache . This morning, he became acutely confused . On examination, he is lethargic , oriented only to himself , and has nuchal rigidity with a positive Kernig’s sign . A lumbar puncture is performed; the opening pressure is 300 mm of water , and the cerebrospinal fluid appears cloudy . While awaiting the results of the lumbar puncture, the patient is given a dose of intravenous dexamethasone 10 mg and then immediately started on intravenous antibiotics with vancomycin, ceftriaxone, and ampicillin . Cerebrospinal fluid findings are as follows: Patient value Tube 1 Erythrocyte count (per mm 3 ) 850 Leukocyte count (per mm 3 ) 3500 Neutrophils (%) 90 Lymphocytes (%) 8 Monocytes (%) 2 Tube 2 Glucose (mg/dL) 25 Protein (mg/dL) 115 Tube 4 Erythrocyte count (per mm 3 ) 4 Leukocyte count (per mm 3 ) 3800 Neutrophils (%) 92 Lymphocytes (%) 8 A Gram stain of the cerebrospinal fluid is shown (figure). The patient’s serum glucose level is 86 mg/dL (reference range, 70–100). Which one of the following changes should be made to this patient’s medication regimen?"},{"section_id":"sec_49f160e3b3af317a5e36","section":"explanation","section_order":2,"text":"This patient has acute bacterial meningitis , most likely caused by Streptococcus pneumoniae . In acute bacterial meningitis , the CSF is typically cloudy with a neutrophil -predominant pleocytosis , elevated protein levels, and lowered glucose , with the CSF -to-plasma glucose ratio \u0026lt; 0.4. S. pneumoniae is the most common cause of bacterial meningitis in older adults; it appears as gram-positive lancet-shaped diplococci on Gram stain . Because of the risk of ceftriaxone -resistant strains of S. pneumoniae , current guidelines recommend that patients with meningitis caused by S. pneumoniae be treated with a combination of vancomycin and ceftriaxone while susceptibility results are pending. In addition, a systematic review of five studies involving adults with acute bacterial meningitis showed that adjunctive dexamethasone reduced mortality risk in patients with pneumococcal meningitis . Typically, a 4-day course of intravenous dexamethasone 10 mg every 6 hours is recommended. Ampicillin is recommended as empiric treatment for Listeria monocytogenes meningitis in immunocompromised people and in adults aged 50 years and older; however, Listeria typically appears as slender gram-positive bacilli on Gram stain . Key learning point: In a patient with suspected Streptococcus pneumoniae meningitis , the most appropriate regimen to initiate while awaiting antibiotic susceptibilities consists of dexamethasone plus both vancomycin and ceftriaxone ."},{"section_id":"sec_bb16f969e14093c1512b","section":"learning_objective","section_order":3,"text":"Recognize pneumococcal meningitis, and select an appropriate antibiotic regimen."},{"section_id":"sec_c22d48ada9764d86ca24","section":"answer","section_order":11,"text":"Discontinue ceftriaxone and vancomycin; continue ampicillin and dexamethasone"},{"section_id":"sec_3188b4f52240454c7971","section":"answer","section_order":12,"text":"Discontinue ampicillin and dexamethasone; continue ceftriaxone and vancomycin"},{"section_id":"sec_b5e86a9632f26c326532","section":"answer","section_order":13,"text":"Discontinue ampicillin; continue ceftriaxone, vancomycin, and dexamethasone"},{"section_id":"sec_bac7882d733bf706554e","section":"answer","section_order":14,"text":"Discontinue vancomycin and dexamethasone; continue ampicillin; change ceftriaxone to meropenem"},{"section_id":"sec_d32bb8a35602dae7ffa2","section":"answer","section_order":15,"text":"Discontinue vancomycin; continue ampicillin, ceftriaxone, and dexamethasone"}],"choices":[{"choice_id":"choice_dc30145f90394c8baff2","choice_label":"A","choice_order":1,"choice_text":"Discontinue ceftriaxone and vancomycin; continue ampicillin and dexamethasone","is_correct":0},{"choice_id":"choice_aa66168bfe3a9f5a5a45","choice_label":"B","choice_order":2,"choice_text":"Discontinue a rality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_22405650db7b69ab13154ecb","section_id":"sec_6a88f57512738f1bcb65","choice_id":null,"raw_span":"Gram stain","start_char":1003,"end_char":1013,"concept_uid":"NET:096ff8da236c","concept_type":"diagnostic_test","canonical_name":"Gram stain","section":"stem","answer_role":"none","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95},{"mention_id":"m_a79e068cc278acf6185f7105","section_id":"sec_6a88f57512738f1bcb65","choice_id":null,"raw_span":"glucose","start_char":1080,"end_char":1087,"concept_uid":"LAB:DIAB-001","concept_type":"lab_test","canonical_name":"Glucose, plasma, fasting","section":"stem","answer_role":"none","assertion":"present","temporality":"current_or_unspecified","experiencer":"patient","source_parser_rule":"v_lexicon_terms:seed_preferred:exact_phrase","confidence":0.95}]},{"id":"daq_c7981505cccf8fe1","source_id":"daq_c7981505cccf8fe1","source":"MedQA","origin_lane":"Medical School boards","target":"numeric_or_threshold","target_confidence":0.9,"correct_label":"A","correct_answer":"Alirocumab 75 mg every 2 weeks","sections":[{"section_id":"sec_f568611ebad38023db5a","section":"stem","section_order":1,"text":"A 62-year-old woman presents to clinic for follow-up. She has a history of tobacco use, hypertension, dyslipidemia, obesity, type 2 diabetes, hypothyroidism, and coronary artery disease complicated by a non-ST-elevation myocardial infarction (MI) 3 years ago that required stent placement. She currently feels well and reports no symptoms. At the time of her MI, she was started on atorvastatin 80 mg daily. However, she self-discontinued the medication after experiencing significant myalgias and stiffness with exercise that persisted despite reducing the dose to 10 mg daily and trying every-other-day dosing. Her creatine kinase levels at the time were normal. She subsequently tried pravastatin 10 mg every other day and rosuvastatin 2.5 mg weekly but experienced similar symptoms. In each case, the symptoms resolved after she discontinued the statin. At her last visit 3 months ago, she was started on ezetimibe 10 mg daily. Since that visit, she has also quit smoking and has lost 5 kg with diet and exercise; she does not drink alcohol. Her current medications are aspirin 81 mg daily, carvedilol 12.5 mg twice daily, lisinopril 20 mg daily, metformin 1000 mg twice daily, semaglutide 1 mg weekly, ezetimibe 10 mg daily, and levothyroxine 75 μg daily. Her blood pressure is 118/74 mm Hg, and her heart rate is 68 beats per minute. Her physical examination is unremarkable. Laboratory testing yields the following results: Patient value Reference range Total cholesterol (mg/dL) 176 125–200 LDL cholesterol (mg/dL) 106 \u0026lt;130 Triglycerides (mg/dL) 110 \u0026lt;150 HDL cholesterol (mg/dL) 38 ≥46 Thyroid stimulating hormone (μU/mL) 3.2 0.5–4.7 25-hydroxyvitamin D (ng/mL) 40 30–80 Which one of the following medications is indicated to further reduce this patient’s cardiovascular risk?"},{"section_id":"sec_9a2620641525bb138336","section":"explanation","section_order":2,"text":"In patients with a history of coronary artery disease , aggressive LDL -lowering therapies are indicated to achieve an LDL - cholesterol level \u0026lt;70 mg/dL. High-intensity statin therapy is typically used in this setting, but if the goal LDL - cholesterol level is not achieved with the highest tolerated statin dose, then the clinician can consider adding ezetimibe , a proprotein convertase subtilisin-kexin type 9 ( PCSK9 ) inhibitor such as alirocumab , or both. Statin -Associated Myopathy Some patients cannot tolerate high-intensity statin therapy , usually because of myalgias or, occasionally, muscle weakness . In patients experiencing such symptoms, the first step is to consider alternative explanations for the symptoms or the possibility of other factors causing or exacerbating the intolerance. For example: • Alcohol is a common culprit that interferes with the body’s elimination of statins , so minimizing alcohol use is essential. • Some commonly prescribed cardiac medications, such as amiodarone and diltiazem , can interfere with statin metabolism. • Low vitamin D levels have been associated with statin-related myopathy in some studies. If none of the above are implicated (as in this case, where the patient does not drink alcohol , take any culprit medications, or have low vitamin D levels), the next step is to transition the patient to a different type of statin . Although patients and clinicians might be tempted to abandon statins as a drug class if a single drug is not effective or causes adverse effects, this would deprive the patient of the well-documented benefits of the drug class in reducing the risk of atherosclerotic cardiovascular disease . A better strategy is to transition the patient to a hydrophilic statin ( rosuvastatin , pravastatin ), as these agents are less likely to cause myalgias than lipophilic statins ( simvastatin , atorvastatin , lovastatin ); once-weekly dosing is recommended to start, with slow titration upward as tolerated. Rosuvastatin is favored for this intermittent-dosing approach because it has a longer half-life . In this case, the patient has tried hydrophilic statins at intermittent lower-dose intervals without success and can now be considered to have statin intolerance . Statin intolerance is defined by the American College of Cardiology as documented unacceptable muscle-related symptoms that resolve with discontinuation of therapy and occur with rechallenge on at least two to three statins , preferably ones that use different metabolic pathways and have different lipophilicity , and one of which is prescribed at the lowest approved dose. Of note, most patients do not have complete statin intolerance ; many are able to tolerate low-dose statin therapy, but often the doses are too low to achieve the low LDL - cholesterol levels that are targeted in high-risk patients. The next step in such patients is initiation of ezetimibe . Ezetimibe inhibits absorption of cholesterol in the small intestine , leading to decreased delivery of cholesterol to the liver , reduction in hepatic cholesterol stores, and increased clearance of circulating cholesterol . Ezetimibe reduces LDL - cholesterol levels by about 15%; it is therefore not uncommon for LDL - cholesterol levels to remain above target with ezetimibe alone. If ezetimibe in combination with the highest tolerated statin dose does not result in goal LDL - cholesterol levels, as in this patient, then a PCSK9 inhibitor is indicated. PCSK9 is an enzyme that binds to the LDL - cholesterol receptor on the surface of hepatocytes , leading to degradation of the LDL - cholesterol receptor and subsequent higher LDL - cholesterol levels. Evolocumab and alirocumab are monoclonal antibodies that bind free plasma PCSK9 , promoting enzyme degradation, leading to increased concentration of LDL - cholesterol receptors and increased hepatic clearance of LDL - cholesterol particles, thus reducing circulating LDL - cholesterol levels. The end result is lower plasma LDL - cholesterol levels. In the GAUSS-2 trial, researchers evaluated PCSK9 inhibitor therapy in patients with statin intolerance and found an absolute reduction in LDL - cholesterol levels (mean reduction, 55%) with a low rate of muscle-related adverse effects and a good overall adverse-effect profile. This patient has statin intolerance and is already taking ezetimibe but continues to have an LDL - cholesterol level above goal. Adding a PCSK9 inhibitor such as evolocumab or alirocumab is the best next step. Key learning point: For patients intolerant of statin therapy who are already taking ezetimibe but continue to have an LDL - cholesterol level above goal, cardiovascular risk can best be reduced by initiating a proprotein convertase subtilisin-kexin type 9 ( PCSK9 ) inhibitor."},{"section_id":"sec_5366da6279b3fd4f79c6","section":"learning_objective","section_order":3,"text":"Choose the best management approach for reducing cardiovascular risk in a patient with statin intolerance."},{"section_id":"sec_3fd4e3c6e977534a55e3","section":"answer","section_order":11,"text":"Alirocumab 75 mg every 2 weeks"},{"section_id":"sec_7ca059f97094db881893","section":"answer","section_order":12,"text":"Icosapent ethyl 2 g twice daily"},{"section_id":"sec_aae8959c77f89ba0b011","section":"answer","section_order":13,"text":"Simvastatin 20 mg daily"},{"section_id":"sec_dbca1c756b7611a0620e","section":"answer","section_order":14,"text":"Coenzyme Q10 50 mg twice daily"},{"section_id":"sec_31a87f94a48e1d5946b0","section":"answer","section_order":15,"text":"Fenofibrate 130 mg daily"}],"choices":[{"choice_id":"choice_2f7698a4f5042346235f","choice_label":"A","choice_order":1,"choice_text":"Alirocumab 75 mg every 2 weeks","is_correct":1},{"choice_id":"choice_0e601dca26ee58643dba","choice_label":"B","choice_order":2,"choice_text":"Icosapent ethyl 2 g twice daily","is_correct":0},{"choice_id":"choice_aa5083761edcb487e0fa","choice_label":"C","choice_order":3,"choice_text":"Simvastatin 20 mg daily","is_correct":0},{"choice_id":"choice_e21ff3bb4516e987d849","choice_label":"D","choice_order":4,"choice_text":"Coenzyme Q10 50 mg twice daily","is_correct":0},{"choice_id":"choice_d408da2fbb719d86bcc1","choice_label":"E","choice_order":5,"choice_text":"Fenofibrate 130 mg daily","is_correct":0}],"mentions":[{"mention_id":"m_c97913e4aa099df0f90f35e0","section_id":"sec_aae8959c77f89ba0b011","choice_id":"choice_aa5083761edcb487e0fa","raw_span":"Simvastatin","start_char":0,"end_char":11,"concept_uid":"MED:MED-0564","concept_type":"medication","canonical_name":"simvastatin","section":"answer","answer_role":"distractor","assertion":"present","temporality":"current_or_unspecif id agonist therapy with either methadone or buprenorphine . Opioid agonist therapy has been shown to reduce the risks associated with ongoing use of nonprescribed opioids during pregnancy . Some clinicians have suggested that pregnancy might provide a good opportunity to attempt opioid detoxification, both because of increased maternal motivation and also to prevent fetal exposure to opioids . However, this approach is generally not a recommended first-line strategy because (a) maternal opioid withdrawal may cause fetal distress and (b) the likelihood of remission from active drug use is lower after detoxification than with ongoing opioid agonist therapy. One concern in infants born to women taking opioids during pregnancy — including prescribed opioids , nonprescribed opioids , and opioid agonists for the treatment of OUD — is neonatal opioid withdrawal syndrome (NOWS). NOWS is a predictable, treatable condition that is associated with a range of symptoms in the neonate and with large costs related to treatment and prolonged hospitalization. In a randomized trial involving pregnant women with OUD , maternal buprenorphine treatment was associated with a shorter, less severe course of NOWS than maternal methadone treatment; affected neonates in the buprenorphine group required less morphine , a shorter duration of treatment for NOWS, and a shorter hospitalization than those in the methadone group. Therefore, although methadone has been the standard of care for treating OUD in pregnant women and remains a commonly used option, buprenorphine has emerged as an effective alternative. Studies have also suggested that maternal buprenorphine treatment is associated with greater birth weight, larger head circumference, and lower risk of preterm birth than maternal methadone treatment. On the other hand, methadone may be associated with better treatment adherence than buprenorphine in pregnant women. The decision between methadone and buprenorphine should be patient centered , taking into account both the patient’s preferences and the treatment options that are most readily accessible. This patient had a period of sustained remission on buprenorphine in the past and is likely a good candidate for buprenorphine treatment now. Buprenorphine is generally used alone during pregnancy (rather than with naloxone ) because of historical concerns that naloxone could potentially cause withdrawal in the fetus. This concern has not been shown to be valid, and the combination of buprenorphine and naloxone is likely safe in pregnancy . However, given that naloxone does not have any clinical benefit and to avoid exposing pregnant women to unnecessary medications, most providers continue to use buprenorphine alone in practice. Key learning point: Most pregnant women with severe opioid use disorder should be treated with opioid agonist therapy (either methadone or buprenorphine ) to reduce the risks associated with ongoing opioid use."},{"section_id":"sec_f6ec21dcb8379161abbf","section":"learning_objective","section_order":3,"text":"Recognize the risks associated with untreated opioid use disorder during pregnancy."},{"section_id":"sec_7fb56811de56772a725b","section":"answer","section_order":11,"text":"Ongoing use of nonprescribed opioids"},{"section_id":"sec_d2502e19f11b8322d8c9","section":"answer","section_order":12,"text":"Placental abruption"},{"section_id":"sec_d6bae60c6fd896552795","section":"answer","section_order":13,"text":"Gestational diabetes"},{"section_id":"sec_bb1808b809ec5f27d0d2","section":"answer","section_order":14,"text":"Preeclampsia"},{"section_id":"sec_023af3222a89820c48bc","section":"answer","section_order":15,"text":"Cleft palate"}],"choices":[{"choice_id":"choice_186cae7645932ea28deb","choice_label":"A","choice_order":1,"choice_text":"Ongoing use of nonprescribed opioids","is_correct":1},{"choice_id":"choice_07aba6f45e78acf5a87d","choice_label":"B","choice_order":2,"choice_text":"Placental abruption","is_correct":0},{"choice_id"
