<script>
(()=>{'use strict';const D=window.REVIEW_DATA,Q=D.questions;const key='kekki-medqa-entity-review-v1';let reviews=JSON.parse(localStorage.getItem(key)||'{}'),idx=0,active=new Set(Object.keys(D.type_counts));
const colors=['#ffd7d9','#ffe4b5','#fff09c','#ccebd5','#cfe5f8','#dcd7fb','#efc9f6','#d4eef0','#e9dec8','#f2cbd8','#d8eadb','#d8def5','#f1e2a9','#dcebc3','#eed9cf','#d4e3ee'];const types=Object.keys(D.type_counts).sort(), cmap=Object.fromEntries(types.map((t,i)=>[t,colors[i%colors.length]]));
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),label=s=>String(s||'').replaceAll('_',' '),cur=()=>Q[idx];
function save(){localStorage.setItem(key,JSON.stringify(reviews));$('saved').textContent='Saved locally';setTimeout(()=>$('saved').textContent='',900);nav()}
function nav(){$('qnav').innerHTML=Q.map((q,i)=>`<button data-i="${i}" class="${i===idx?'active ':''}${reviews[q.id]?.status||''}" title="${esc(q.source)} · ${esc(q.source_id)}">${i+1}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render()});$('progress').textContent=`${cur().source} · Question ${idx+1} of ${Q.length} · ${Object.values(reviews).filter(r=>r.status==='accepted').length} accepted · ${Object.values(reviews).filter(r=>r.status==='flagged').length} flagged`}
function spanHtml(text,mentions){let good=mentions.filter(m=>active.has(m.concept_type)&&m.start_char!=null&&m.end_char>m.start_char&&m.end_char<=text.length).sort((a,b)=>a.start_char-b.start_char||(b.end_char-b.start_char)-(a.end_char-a.start_char));let out='',pos=0;for(const m of good){if(m.start_char<pos)continue;out+=esc(text.slice(pos,m.start_char));out+=`<mark class="entity" data-mid="${m.mention_id}" style="--c:${cmap[m.concept_type]}">${esc(text.slice(m.start_char,m.end_char))}</mark>`;pos=m.end_char}return out+esc(text.slice(pos))}
function section(q,s){const ms=q.mentions.filter(m=>m.section_id===s.section_id);return `<section class="section"><h2>${label(s.section)} <span>· ${ms.length} entities</span></h2><div class="copy">${spanHtml(s.text,ms)}</div></section>`}
function choices(q){return `<section class="section"><h2>Answer choices</h2><div class="choices">${q.choices.map(c=>{const ms=q.mentions.filter(m=>m.choice_id===c.choice_id);return `<div class="choice ${c.is_correct?'correct':''}"><span class="choice-label">${esc(c.choice_label)}.</span><span class="copy">${spanHtml(c.choice_text,ms)}</span>${c.is_correct?' <span class="pill">correct</span>':''}</div>`}).join('')}</div></section>`}
function bindSpans(){document.querySelectorAll('.entity').forEach(e=>e.onclick=()=>{document.querySelectorAll('.entity.selected').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');detail(cur().mentions.find(m=>m.mention_id===e.dataset.mid))})}
function detail(m){if(!m)return;const fields=[['Type',label(m.concept_type)],['Canonical',m.canonical_name||'—'],['Raw span',m.raw_span],['Section',label(m.section)],['Answer role',label(m.answer_role)],['Assertion',label(m.assertion)],['Temporality',label(m.temporality)],['Experiencer',label(m.experiencer)],['Confidence',Number(m.confidence).toFixed(2)],['Concept UID',m.concept_uid],['Parser rule',m.source_parser_rule]];$('detail').className='detail';$('detail').innerHTML=`<div class="swatch" style="background:${cmap[m.concept_type]}"></div><h3>${esc(m.raw_span)}</h3><dl>${fields.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b||'—')}</dd>`).join('')}</dl>`}
function render(){const q=cur(),r=reviews[q.id]||{};nav();$('source').textContent=`${q.source} · ${q.origin_lane} · ${q.source_id}`;$('title').textContent=label(q.target);$('meta').innerHTML=`<span class="pill">Correct: ${esc(q.correct_label)} · ${esc(q.correct_answer)}</span><span class="pill">Target confidence: ${Number(q.target_confidence).toFixed(2)}</span><span class="pill">${q.mentions.length} parsed spans</span>`;$('content').innerHTML=q.sections.filter(s=>s.section!=='answer').map(s=>section(q,s)).join('')+choices(q);$('detail').className='detail-empty';$('detail').textContent='Click a highlighted span to inspect its parsed metadata.';$('notes').value=r.notes||'';$('accept').className=r.status==='accepted'?'on accept':'';$('flag').className=r.status==='flagged'?'on flag':'';bindSpans();window.scrollTo({top:0,behavior:'smooth'})}
$('filters').innerHTML=types.map(t=>`<label class="filter"><input type="checkbox" checked data-type="${t}"><span class="swatch" style="background:${cmap[t]}"></span><span>${label(t)} (${D.type_counts[t]})</span></label>`).join('');document.querySelectorAll('[data-type]').forEach(c=>c.onchange=()=>{c.checked?active.add(c.dataset.type):active.delete(c.dataset.type);render()});
$('prev').onclick=()=>{idx=(idx-1+Q.length)%Q.length;render()};$('next').onclick=()=>{idx=(idx+1)%Q.length;render()};$('accept').onclick=()=>{const q=cur(),r=reviews[q.id]||{};r.status=r.status==='accepted'?'':'accepted';r.updated_at=new Date().toISOString();reviews[q.id]=r;save();render()};$('flag').onclick=()=>{const q=cur(),r=reviews[q.id]||{};r.status=r.status==='flagged'?'':'flagged';r.updated_at=new Date().toISOString();reviews[q.id]=r;save();render()};$('notes').oninput=()=>{const q=cur(),r=reviews[q.id]||{};r.notes=$('notes').value;r.updated_at=new Date().toISOString();reviews[q.id]=r;save()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),reviews},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='medqa_entity_review.json';a.click();URL.revokeObjectURL(a.href)};document.onkeydown=e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};render()})();
</script></body></html>
