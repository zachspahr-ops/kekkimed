    * { box-sizing:border-box; }

    input[type="search"] { width:210px; }
    input[type="range"] { width:145px; padding:0; }
    button { cursor:pointer; }
    button:hover { border-color:var(--muted); }
    .check { display:flex; align-items:center; gap:6px; min-height:32px; }
    .check input { min-height:auto; }
    .visible-count { margin-left:auto; align-self:center; color:var(--muted); font-size:12px; white-space:nowrap; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:10px; align-items:start; }
    #canvas-wrap { position:relative; width:100%; height:760px; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; cursor:grab; }
    canvas.dragging { cursor:grabbing; }
    .details { min-height:260px; max-height:760px; overflow:auto; padding:12px; }
    .details h2 { margin:0 0 8px; font-size:16px; font-weight:500; overflow-wrap:anywhere; }
    .details h3 { margin:14px 0 6px; font-size:12px; font-weight:500; }
    .details p { margin:7px 0; color:var(--muted); font-size:12px; line-height:1.45; overflow-wrap:anywhere; }
    .details strong { color:var(--text); font-weight:500; }
    .badge { display:inline-block; margin:2px 4px 2px 0; padding:2px 6px; border:1px solid var(--border); border-radius:999px; background:var(--panel2); font-size:11px; }
    .profile-row { display:grid; grid-template-columns:96px minmax(0,1fr) 38px; gap:7px; align-items:center; margin:5px 0; font-size:11px; }
    .bar { height:7px; background:var(--panel2); border-radius:3px; overflow:hidden; }
    .bar span { display:block; height:100%; }
    .rolebar { display:flex; height:8px; margin:7px 0; border-radius:3px; overflow:hidden; background:var(--panel2); }
    .rolebar .correct { background:var(--correct); }
    .rolebar .distractor { background:var(--distractor); }
    .neighbor { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin:5px 0; font-size:11px; }
    .neighbor span:first-child { overflow-wrap:anywhere; }
    .neighbor span:last-child { color:var(--muted); }
    .legend { display:flex; gap:10px 14px; flex-wrap:wrap; margin-top:10px; color:var(--muted); font-size:11px; }
    .legend span { display:inline-flex; gap:5px; align-items:center; }
    .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    @media (max-width:1000px) { .layout { grid-template-columns:1fr; } .details { max-height:none; } #canvas-wrap { height:620px; } }

function nodeColor(node){if(controls.color.value==="role")return roleColor(node);if(controls.color.value==="status")return node.st==="curated"?css("--curated"):css("--provisional");return (domainMap.get(node.dom)||domainMap.get("unknown")).color;}
function drawNode(node,index){const [x,y]=position(node);const r=Math.max(node.r,2.2/view.scale);ctx.save();ctx.globalAlpha=node.tier==="D"?.48:node.tier==="C"?.68:1;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=controls.color.value==="system"&&["multidisciplinary","cross_cutting_action"].includes(node.pc)?css("--panel2"):nodeColor(node);ctx.fill();if(controls.color.value==="system"&&["multidisciplinary","cross_cutting_action"].includes(node.pc)&&node.dist.length){let start=-Math.PI/2;ctx.lineWidth=Math.max(2.2/view.scale,r*.26);node.dist.slice(0,4).forEach(part=>{const end=start+Math.PI*2*part.share;ctx.beginPath();ctx.arc(x,y,r+1.2/view.scale,start,end);ctx.strokeStyle=(domainMap.get(part.code)||domainMap.get("unknown")).color;ctx.stroke();start=end;});}else{ctx.strokeStyle=node.flags.length?css("--danger"):css("--border");ctx.lineWidth=Math.max((node.flags.length?1.4:0.8)/view.scale,node.flags.length?1.8:1);ctx.stroke();}if(index===selected){ctx.globalAlpha=1;ctx.beginPath();ctx.arc(x,y,r+4/view.scale,0,Math.PI*2);ctx.strokeStyle=css("--focus");ctx.lineWidth=2.5/view.scale;ctx.stroke();}ctx.restore();}
function drawLabels(){const boxes=[];ctx.font=`500 ${10/view.scale}px system-ui`;ctx.textAlign="left";const candidates=[...visibleSet].filter(i=>nodes[i].priority||i===selected||view.scale>=1.4).sort((a,b)=>(a===selected?-1:b===selected?1:nodes[b].w-nodes[a].w||nodes[b].q-nodes[a].q));for(const i of candidates){const n=nodes[i],[x,y]=position(n),r=Math.max(n.r,2.2/view.scale);const label=view.scale<.7&&n.l.length>34?`${n.l.slice(0,31)}...`:n.l;const textWidth=ctx.measureText(label).width;let tx=x+r+4/view.scale,ty=y+3/view.scale;if(view.x+(tx+textWidth)*view.scale>width-5)tx=x-r-4/view.scale-textWidth;if(view.y+(ty-11/view.scale)*view.scale<5)ty=y+13/view.scale;const box={x:tx-2/view.scale,y:ty-11/view.scale,w:textWidth+4/view.scale,h:14/view.scale};const blocked=i!==selected&&boxes.some(other=>box.x<other.x+other.w&&box.x+box.w>other.x&&box.y<other.y+other.h&&box.y+box.h>other.y);if(blocked)continue;boxes.push(box);ctx.lineWidth=3.5/view.scale;ctx.strokeStyle=css("--bg");ctx.fillStyle=css("--text");ctx.strokeText(label,tx,ty);ctx.fillText(label,tx,ty);}}
function draw(){if(!width||!height)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.scale,view.scale);if(controls.layout.value==="system"){ctx.fillStyle=css("--muted");ctx.font=`500 ${Math.max(11,13/view.scale)}px system-ui`;ctx.textAlign="center";graph.groupLabels.forEach(g=>{const d=domainMap.get(g.code)||domainMap.get("unknown");ctx.fillText(`${d.short||d.name} | ${g.count}`,g.x,g.y);});ctx.textAlign="start";}ctx.strokeStyle=css("--line");ctx.lineCap="round";visibleEdges.forEach(e=>{const a=nodes[e[0]],b=nodes[e[1]],p=position(a),q=position(b);ctx.globalAlpha=Math.min(.72,.24+.1*Math.log2(e[2]+1));ctx.lineWidth=Math.max(.7/view.scale,Math.min(4,.55+Math.log2(e[2]+1)*.55));ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();});ctx.globalAlpha=1;visibleSet.forEach(i=>drawNode(nodes[i],i));if(controls.labels.checked)drawLabels();ctx.restore();}
function graphPoint(event){const rect=canvas.getBoundingClientRect();return {x:(event.clientX-rect.left-view.x)/view.scale,y:(event.clientY-rect.top-view.y)/view.scale};}
function nearestNode(event){const p=graphPoint(event);let best=-1,bestD=Infinity;visibleSet.forEach(i=>{const n=nodes[i],q=position(n),dx=q[0]-p.x,dy=q[1]-p.y,d=dx*dx+dy*dy;if(d<bestD&&d<(n.r+8/view.scale)**2){best=i;bestD=d;}});return best;}
function selectNode(index,center=false){selected=index;renderDetails();if(center&&index>=0){const p=position(nodes[index]);view.scale=Math.max(view.scale,1.15);view.x=width/2-p[0]*view.scale;view.y=height/2-p[1]*view.scale;}draw();}
function renderDetails(){const target=document.getElementById("details");if(selected<0){target.innerHTML="<h2>No entity selected</h2><p>Network totals and active filters are shown above.</p>";return;}const n=nodes[selected];const total=n.c+n.d;const correctShare=total?100*n.c/total:0;const dist=n.dist.length?n.dist.map(part=>{const d=domainMap.get(part.code)||domainMap.get("unknown");return `<div class="profile-row"><span>${escapeHtml(d.name)}</span><div class="bar"><span style="width:${(100*part.share).toFixed(1)}%;background:${d.color}"></span></div><span>${(100*part.share).toFixed(0)}%</span></div>`;}).join(""):"<p>No stable domain evidence.</p>";const linked=visibleEdges.filter(e=>e[0]===selected||e[1]===selected).sort((a,b)=>b[2]-a[2]||b[7]-a[7]).slice(0,12).map(e=>{const other=nodes[e[0]===selected?e[1]:e[0]];return `<div class="neighbor"><span>${escapeHtml(other.l)}</span><span>${e[2]} q | ${e[7].toFixed(1)}% distractor</span></div>`;}).join("");target.innerHTML=`<h2>${escapeHtml(n.l)}</h2><div><span class="badge">${escapeHtml(n.cat.replaceAll("_"," "))}</span><span class="badge">${escapeHtml(n.st)}</span><span class="badge">${escapeHtml(n.pc.replaceAll("_"," "))}</span><span class="badge">evidence ${n.tier}</span></div><p><strong>${format(n.q)}</strong> questions | <strong>${format(n.w)}</strong> weighted degree | ${format(n.ec)} relationships</p><h3>Answer-role history</h3><div class="rolebar"><span class="correct" style="width:${correctShare.toFixed(1)}%"></span><span class="distractor" style="width:${(100-correctShare).toFixed(1)}%"></span></div><p>${format(n.c)} correct | ${format(n.d)} distractor | ${format(n.u)} unknown</p><h3>Domain profile</h3>${dist}<p>${format(n.dq)} direct MKSAP contexts | ${format(n.iq)} high-precision inferred contexts</p><p>Dominant share ${(100*n.share).toFixed(1)}% | entropy ${n.ent.toFixed(2)} | stability ${(100*n.stab).toFixed(0)}%</p><h3>Visible relationships</h3>${linked||"<p>No relationships under the current filters.</p>"}`;}
controls.support.addEventListener("input",()=>applyFilters(false));controls.domain.addEventListener("change",()=>applyFilters(true));controls.profile.addEventListener("change",()=>applyFilters(true));controls.color.addEventListener("change",draw);controls.layout.addEventListener("change",()=>applyFilters(true));controls.labels.addEventListener("change",draw);document.getElementById("fit").addEventListener("click",fitVisible);
controls.search.addEventListener("input",()=>{const term=controls.search.value.trim().toLowerCase();if(!term)return;const matches=nodes.map((n,i)=>[n,i]).filter(([n])=>n.l.toLowerCase().includes(term)).sort((a,b)=>b[0].w-a[0].w);if(matches.length)selectNode(matches[0][1],true);});
canvas.addEventListener("pointerdown",event=>{canvas.setPointerCapture(event.pointerId);drag={x:event.clientX,y:event.clientY,vx:view.x,vy:view.y};dragMoved=false;canvas.classList.add("dragging");});
canvas.addEventListener("pointermove",event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;view.x=drag.vx+dx;view.y=drag.vy+dy;draw();});
canvas.addEventListener("pointerup",event=>{if(!dragMoved){const hit=nearestNode(event);selectNode(hit);}drag=null;canvas.classList.remove("dragging");});
canvas.addEventListener("wheel",event=>{event.preventDefault();const rect=canvas.getBoundingClientRect(),mx=event.clientX-rect.left,my=event.clientY-rect.top,gx=(mx-view.x)/view.scale,gy=(my-view.y)/view.scale;const factor=Math.exp(-event.deltaY*.0012);view.scale=Math.max(.03,Math.min(8,view.scale*factor));view.x=mx-gx*view.scale;view.y=my-gy*view.scale;draw();},{passive:false});
new ResizeObserver(()=>resize()).observe(wrap);resize();applyFilters(true);
</script>
</body>
